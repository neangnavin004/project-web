  <style>
    /* smooth transitions for dark/light */
    *, *::before, *::after { transition: background-color 0.3s, border-color 0.3s, color 0.2s; }
    body { font-family: 'DM Sans', sans-serif; }
    h1,h2,h3,.font-display { font-family: 'Syne', sans-serif; }

    /* Light mode */
    :root {
      --bg: #f8f9fa;
      --nav-bg: #ffffff;
      --card-bg: #ffffff;
      --text: #1a2332;
      --muted: #6b7280;
      --border: rgba(0,0,0,0.08);
    }
    /* Dark mode */
    .dark {
      --bg: #0a0f1a;
      --nav-bg: #0f1724;
      --card-bg: #111d2e;
      --text: #f0f6ff;
      --muted: #8899aa;
      --border: rgba(255,255,255,0.08);
    }

    body { background: var(--bg); color: var(--text); }

    /* Navbar pill */
    .nav-pill {
      background: var(--nav-bg);
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .dark .nav-pill { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }

    /* Cards */
    .drink-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .drink-card:hover { transform: translateY(-6px); box-shadow: 0 16px 40px rgba(0,0,0,0.12); }
    .dark .drink-card:hover { box-shadow: 0 16px 40px rgba(0,0,0,0.5); }

    /* Toggle button */
    .theme-toggle {
      position: relative;
      width: 52px; height: 28px;
      background: #e5e7eb;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .dark .theme-toggle { background: #22c55e; }
    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 22px; height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .dark .theme-toggle::after { transform: translateX(24px); }

    /* Blob bg */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    .dark .blob { opacity: 0.2; }

    /* Decorative ring */
    .ring-deco {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(22,163,74,0.25);
      animation: spin-slow 18s linear infinite;
    }

    /* Opacity-0 initial for animations */
    .anim-init { opacity: 0; }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>

      <script>
    let isDark = false;

    function toggleTheme() {
      isDark = !isDark;
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('modeLabel').textContent = isDark ? 'Dark Mode' : 'Light Mode';
    }

    // Keyboard shortcut: press D
    document.addEventListener('keydown', e => {
      if (e.key === 'd' || e.key === 'D') toggleTheme();
    });
  </script>
